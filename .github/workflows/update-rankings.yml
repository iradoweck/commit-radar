name: Update Country Rankings (JSON)

on:
  schedule:
    # Executa diariamente às 23:00 UTC (01:00 AM no horário de Moçambique / CAT - UTC+2)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset específico ou vazio para atualizar todos os 34 do catálogo'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-rankings:
    name: Extract & Generate Country JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CLI Engine
        run: go build -o commit-rank .

      - name: Generate Country JSON Datasets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/countries
          if [ -n "${{ github.event.inputs.preset }}" ]; then
            PRESETS="${{ github.event.inputs.preset }}"
          else
            PRESETS="worldwide mozambique angola nigeria south-africa kenya united-states canada mexico the-bahamas panama brazil argentina colombia venezuela uruguay netherlands portugal germany russia france china india japan south-korea saudi-arabia australia new-zealand papua-new-guinea hong-kong macau taiwan kosovo kurdistan"
          fi

          for preset in $PRESETS; do
            echo "Extracting ranking for: $preset"
            ./commit-rank --preset "$preset" --output json --file "data/countries/${preset}.json" || echo "Skipped $preset"
          done

      - name: Commit and Push Updated Datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/countries/*.json
          git diff --staged --quiet || git commit -m "chore(data): update automated country rankings JSON"
          git push
